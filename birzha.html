<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Математическая биржа · Задачи</title><link rel="stylesheet" href="./katex.min.css"><script src="./katex.min.js"></script><script src="./auto-render.min.js"></script><script src="./cutting.js?v=candy-2"></script><script src="./review-grid.js?v=candy-2"></script><script src="./supabase.min.js"></script><script src="./bank-auth.js?v=candy-2"></script><script src="./saved-games.js?v=candy-2"></script><script src="./task-manager.js?v=candy-2"></script><script src="./attachments.js"></script><style>body{font:16px system-ui;color:#192844;background:#f1f5fb;margin:0}main{max-width:960px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px;margin:20px 0}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#285bb6;color:white}a{color:#285bb6}#error{color:#9b1831}</style><link rel="stylesheet" href="./platform-ui.css?v=candy-2"><script src="./platform-ui.js?v=candy-2"></script></head><body><main><a href="./">Математические игры</a><h1>Математическая биржа</h1><p>Подготовка задач. Проведение игры будет подключено после получения полных согласованных правил.</p><section id="create"><button id="new">Создать набор задач</button></section><p id="error" role="status"></p><section id="tasks" hidden><p>Сохраните эту ссылку: она даёт доступ ведущего к набору.</p><input id="link" readonly aria-label="Ссылка ведущего"><div id="editor"></div></section></main><script>

</script></body></html>
