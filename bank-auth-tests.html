<!doctype html><html lang="en"><meta charset="utf-8"><title>Persisted auth regression</title><body><h1>Persisted auth regression</h1><p id="result">Running…</p><script>
// Isolated in-memory browser storage and Auth transport. Never uses real credentials.
function memory(){let values={};return{getItem:k=>values[k]??null,setItem:(k,v)=>values[k]=String(v),removeItem:k=>delete values[k]}}Object.defineProperty(window,'localStorage',{value:memory()});Object.defineProperty(window,'sessionStorage',{value:memory()});
const id='00000000-0000-4000-8000-000000000001',fakeUser={id,email:'offline@example.invalid'},jwt=exp=>btoa(JSON.stringify({alg:'HS256',typ:'JWT'}))+'.'+btoa(JSON.stringify({sub:id,exp,role:'authenticated'}))+'.offline',expired={access_token:jwt(Math.floor(Date.now()/1000)-120),refresh_token:'offline-old',expires_at:Math.floor(Date.now()/1000)-120,expires_in:3600,token_type:'bearer',user:fakeUser};sessionStorage.setItem('mg-bank-session',JSON.stringify(expired));let refreshes=0;

</script><script src="./supabase.min.js"></script><script>

</script><script src="./bank-auth.js"></script><script>
(async()=>{const assert=(x,m)=>{if(!x)throw Error(m)},s=await BankAuth.required();assert(s.user.id===id,'legacy session migration');assert(sessionStorage.getItem('mg-bank-session')===null,'old tab session removed');assert(refreshes===1,'expired session must refresh');assert(JSON.parse(localStorage.getItem('mg-bank-auth')).refresh_token==='offline-new','refreshed token persists');const other=supabase.createClient('https://qavxgdmiqtguplnamybd.supabase.co','sb_publishable_offline',{auth:{storageKey:'mg-bank-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});assert((await other.auth.getSession()).data.session.user.id===id,'new client restores session');assert((await BankAuth.rpc('offline',{},true)).ok,'authenticated RPC');await BankAuth.client.auth.signOut({scope:'local'});assert(!await BankAuth.session(),'explicit local logout');assert(localStorage.getItem('mg-bank-auth')===null,'logout removes persisted tokens');document.getElementById('result').textContent='PASS: tab-session migration; automatic expired-token refresh; persisted renewed session; new client restoration; RPC; explicit logout';other.auth.stopAutoRefresh();BankAuth.client.auth.stopAutoRefresh()})().catch(e=>document.getElementById('result').textContent='FAIL: '+e.stack);
