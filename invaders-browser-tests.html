<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Захватчики · целевые тесты</title><link rel="stylesheet" href="./platform-ui.css?v=candy-2"><script src="./platform-ui.js?v=candy-2"></script><script src="./supabase.min.js"></script><script src="./bank-auth.js?v=candy-2"></script><script src="./attachments.js?v=invaders-1"></script><script src="./xlsx.full.min.js"></script><script src="./task-manager.js?v=candy-2"></script></head><body><main><h1>Проверка «Захватчиков»</h1><p>Создаёт отдельную тестовую игру. Настоящие игры и банк не изменяет.</p><button id="run" class="mg-primary">Запустить целевые тесты</button><button id="finish" hidden>Завершить тестовую игру</button><pre id="out"></pre><div id="links"></div></main><script>
const out=document.getElementById('out'),log=s=>out.textContent+='\n'+s,assert=(b,m)=>{if(!b)throw Error(m)},rpc=(name,body)=>BankAuth.rpc(name,body);let fixture,stream;const op=(name,token,payload={})=>rpc('iv_api',{op:name,game:fixture.id,token,payload});
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{
const board=[];for(let y=0;y<3;y++)for(let x=0;x<7;x++)board.push({x,y,price:3,start:y===1&&x===0?1:y===1&&x===6?2:null});fixture=await rpc('iv_api',{op:'create',payload:{title:'QA · Захватчики',names:['QA A','QA B'],width:7,height:3,counts:[3,3,1,1,1],board}});const g=fixture.id,h=fixture.hostToken;document.getElementById('finish').hidden=false;
let rows=(await rpc('ng_tasks',{k:'iv',g,t:h,op:'get'})).rows;rows.forEach(r=>r.content={condition:'Вычислите $1+0$.',mode:'number',key:'1',kind:'standard',attachments:'optional'});await rpc('ng_tasks',{k:'iv',g,t:h,op:'save',payload:{rows}});let s=await op('start',h),ta=s.links[0].token,tb=s.links[1].token;fixture={...fixture,ta,tb};const links=document.getElementById('links');for(const[label,key,value]of[['Ведущий','host',h],['Команда A','team',ta],['Команда B','team',tb]]){const a=document.createElement('a');a.href='invaders.html#'+new URLSearchParams({game:g,[key]:value});a.textContent=label;links.append(a,document.createElement('br'))}
await Promise.all([ta,tb].flatMap(t=>[1,2,3].map(code=>op('submit',t,{id:crypto.randomUUID(),code:String(code),answer:'1'}))));log('PASS: одинаковые задачи, автоматическая проверка и резерв');
async function payload(t,x,y,code){const state=await op('state',t),cell=state.map.find(c=>c.x===x&&c.y===y),answer=state.records.find(r=>r.code===String(code)&&r.status==='yes');return{id:crypto.randomUUID(),x,y,version:cell.version,tasks:[answer.id]}}
for(const[t,x,code]of[[ta,1,1],[ta,2,2],[tb,5,1],[tb,4,2]])await op('capture',t,await payload(t,x,1,code));
let received=0;const signal=s.signal;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Realtime subscription timeout')),15000);stream=BankAuth.client.channel('iv-test:'+crypto.randomUUID()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'iv_signals',filter:'channel=eq.'+signal},()=>received++).subscribe(status=>{if(status==='SUBSCRIBED'){clearTimeout(timer);resolve()}else if(status==='CHANNEL_ERROR'){clearTimeout(timer);reject(Error('Realtime channel error'))}})});log('PASS: подключение Realtime');
const pa=await payload(ta,3,1,3),pb=await payload(tb,3,1,3),race=await Promise.allSettled([op('capture',ta,pa),op('capture',tb,pb)]);assert(race.filter(r=>r.status==='fulfilled').length===1,'must have exactly one winner');const winner=race[0].status==='fulfilled'?ta:tb,loser=winner===ta?tb:ta;const winnerState=await op('state',winner),loserState=await op('state',loser);assert(winnerState.stocks[winnerState.me.id].length===0,'winner must spend one task');assert(loserState.stocks[loserState.me.id].length===1,'loser must not spend');assert(winnerState.map.find(c=>c.x===3&&c.y===1).bid===1,'bid must remain one');log('PASS: одновременные захваты — один победитель, второй без списания');
await op('capture',winner,winner===ta?pa:pb);assert((await op('state',winner)).stocks[winnerState.me.id].length===0,'retry must not spend twice');log('PASS: повтор запроса не дублирует списание');
const start=Date.now();while(!received&&Date.now()-start<15000)await new Promise(r=>setTimeout(r,100));assert(received>0,'Realtime update was not delivered');log('PASS: изменение поля получено по Realtime');
const form=new FormData();for(const[k,v]of Object.entries({kind:'iv',game:g,token:ta,code:'4'}))form.append(k,v);form.append('file',new Blob(['%PDF-1.4\nQA solution\n%%EOF'],{type:'application/pdf'}),'iv-fixture.pdf');const file=await Attachments.request(form);await op('submit',ta,{id:crypto.randomUUID(),code:'4',answer:'1',files:[file.id]});const signed=await Attachments.request({op:'get',kind:'iv',game:g,token:h,id:file.id});assert((await(await fetch(signed.url)).text()).startsWith('%PDF-'),'stored PDF bytes');let denied=false;try{await Attachments.request({op:'get',kind:'iv',game:g,token:tb,id:file.id})}catch(e){denied=true}assert(denied,'other team must not read file');log('PASS: файл загружен, доступен ведущему и закрыт другой команде');
const state=await op('state',ta);assert(state.tasks.every(t=>!t.content||!Object.hasOwn(t.content,'key')),'keys must remain private');assert(!Object.keys(state.stocks).includes(loserState.me.id)||state.me.id===loserState.me.id,'other inventory identities private');
window.GameDefinitions={iv:{fields:[['price','Стоимость']],rules:'Задачи: 3, 5, 8, 11, 15'}};const write=XLSX.writeFile;let book;XLSX.writeFile=b=>book=b;await TaskManager.exportTemplate('iv',rows);XLSX.writeFile=write;const reread=XLSX.read(XLSX.write(book,{type:'array',bookType:'xlsx'}),{type:'array'}),exported=XLSX.utils.sheet_to_json(reread.Sheets['Задачи']);assert(exported.length===9&&new Set(exported.map(r=>r['Стоимость'])).size===5,'template tiers');log('PASS: Excel-шаблон содержит все пять стоимостей');log('ALL TARGETED TESTS PASS');
}catch(e){log('FAIL: '+e.stack)}finally{if(stream)BankAuth.client.removeChannel(stream)}};
document.getElementById('finish').onclick=async()=>{await op('finish',fixture.hostToken);log('Тестовая игра завершена; действует штатная очистка.');document.getElementById('finish').disabled=true};
</script></body></html>
