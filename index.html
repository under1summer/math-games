<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Математические игры</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f4ff; color: #27213c; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 720px; padding: clamp(24px, 6vw, 64px); background: white; border: 1px solid #e6dff5; border-radius: 24px; }
    h1 { margin: 0 0 20px; font-size: clamp(32px, 6vw, 48px); line-height: 1.15; }
    p { margin: 0; color: #625a75; font-size: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Математические игры</h1>
    <p>Здесь появятся интерактивные игры и головоломки для занятий математикой.</p>
  </main>
</body>
</html>
