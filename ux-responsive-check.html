<!doctype html><html lang="ru"><meta charset="utf-8"><title>Responsive QA</title><style>body{font:14px system-ui;background:#eee}iframe{display:block;border:1px solid #999;height:844px;background:white;margin-top:10px}button,select{font:inherit;padding:8px;margin:4px}</style><select id="page"><option value="bank.html">Банк задач</option><option value="index.html">Каталог</option><option value="new-games.html?kind=xo">Создание игры</option><option value="abaka.html">Абака</option><option value="perestrelka.html">Перестрелка</option><option value="optom-dorozhe.html">Оптом дороже</option></select><button data-width="390">Телефон 390</button><button data-width="768">Планшет 768</button><button data-width="1280">Компьютер 1280</button><button id="run">Проверить все страницы</button><span id="result"></span><div><input id="url" placeholder="Путь страницы для проверки" size="60"><button id="open">Открыть</button></div><pre id="checks"></pre><iframe id="frame" title="Responsive preview" width="390" src="bank.html"></iframe><script>
const f=document.getElementById('frame'),r=document.getElementById('result');function measure(){const d=f.contentDocument;r.textContent='Viewport '+f.contentWindow.innerWidth+' · document '+d.documentElement.scrollWidth+(d.documentElement.scrollWidth<=f.contentWindow.innerWidth?' · PASS':' · OVERFLOW')}f.onload=()=>setTimeout(measure,500);document.getElementById('page').onchange=e=>f.src=e.target.value;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.width=b.dataset.width;setTimeout(measure,300)});
document.getElementById('open').onclick=()=>f.src=document.getElementById('url').value;
document.getElementById('run').onclick=async()=>{const checks=document.getElementById('checks'),preview=document.createElement('iframe');preview.style.cssText='position:absolute;left:-10000px;visibility:hidden';document.body.append(preview);let failed=0,total=0;const pages=['index.html','bank.html','saved-games.html','abaka.html','optom-dorozhe.html','perestrelka.html','birzha.html',...['p52','xo','maze','bonus','domino'].map(k=>'new-games.html?kind='+k)];checks.textContent='Checking…';for(const width of[390,768,1280]){preview.width=width;for(const page of pages){await new Promise(resolve=>{preview.onload=resolve;preview.src=page});await new Promise(resolve=>setTimeout(resolve,120));const overflow=preview.contentDocument.documentElement.scrollWidth>width;failed+=overflow?1:0;total++;checks.textContent+='\n'+(overflow?'OVERFLOW ':'PASS ')+width+' '+page}}preview.remove();checks.textContent+='\nRESULT '+(failed?'FAIL':'PASS')+' '+total+' layouts · '+failed+' overflow';};
</script></html>
